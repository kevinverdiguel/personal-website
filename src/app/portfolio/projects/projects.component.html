<div *ngFor="let options of respOptions" [ngClass]="options.viewClasses"
    class="flex-column align-items-center text-center vw-90 mx-auto" data-aos="fade-up" data-aos-once="false"
    data-aos-duraion="700" data-aos-anchor-placement="top-bottom">
    <h1 [ngClass]="options.titleClasses" class="mb-5"><span class="fw-bold color">My</span> Projects</h1>
    <div class="d-flex "
        [ngClass]="{'justify-content-center flex-wrap': !options.displayInColumn, 'flex-column  align-items-center': options.displayInColumn}"
        *ngIf="projects$ | async as projects">
        <div *ngFor="let project of projects" class="card project-card m-3"
            [ngClass]="{'m-3': !options.displayInColumn, 'mb-3': options.displayInColumn}" style="height: 600px;">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title font-weight-bold text-left project-title" [title]="project.name">
                    {{project.name}}
                </h5>
                <h6 class="card-subtitle mb-2 font-weight-lighter text-left">
                    <i [ngClass]="project.stack.iconClasses"></i>
                    {{project.stack.name}}
                </h6>
                <div *ngIf="project.name === specialProjectName" class="mb-2">
                    <video width="280" height="180" controls preload="metadata" class="img-fluid" playsinline>
                        <source src="assets/images/space-invaders.webm" type="video/webm">
                        <source src="assets/images/space-invaders.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="card-body d-flex flex-column" *ngIf="project.name != specialProjectName">
                    <img src="{{project.imageUrl}}" />
                </div>

                <p class="card-text text-left">
                    {{project.description}}
                </p>
                <div class="d-flex flex-row justify-content-start mx-auto">
                    <a [href]="project.sourceUrl" *ngIf="project.sourceUrl" class="btn btn-dark">
                        <i class="fa-lg mr-1 "></i>
                        <fa-icon icon="code"></fa-icon> Source
                    </a>
                </div>
            </div>
        </div>
    </div>
    <button *ngIf="isHome$ | async" routerLink="/projects" class="mt-3 btn btn-dark">
        See More Projects
    </button>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</div>
